[pytest]
DJANGO_SETTINGS_MODULE = django_project.settings
python_files = test_*.py
testpaths = tests

addopts =
    -v
    --tb=short
    -ra
    --durations=10
    --continue-on-collection-errors
    --alluredir=allure-results
    --clean-alluredir
    --strict-markers

# An unexpectedly passing xfail is a failure, so it cannot hide a defect.
xfail_strict = true

markers =
    unit: isolated unit tests
    integration: integration tests
    ui: browser UI tests driven by Playwright
    bdd: Gherkin acceptance tests executed with pytest-bdd

filterwarnings =
    ignore:Log out via GET requests is deprecated
    ignore:The USE_L10N setting is deprecated

# Captured logs are shown only for failing tests (terminal and Allure), which
# keeps successful runs quiet while preserving diagnostics when needed.
log_level = INFO
log_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_date_format = %H:%M:%S